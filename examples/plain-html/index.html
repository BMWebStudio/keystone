<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validator example</title><style>body{font:16px system-ui;max-width:42rem;margin:3rem auto;padding:1rem}form{display:grid;gap:1rem}label{font-weight:700}input,textarea,button{font:inherit;padding:.7rem}.a11y-field-error{color:#a42c35;margin:.25rem 0}.a11y-error-summary{padding:1rem;background:#fdebec;border-left:4px solid #a42c35}</style></head><body><h1>Contact us</h1><form data-a11y-form><div><label for="name">Name</label><input id="name" name="name" required data-a11y-message-required="Enter your name."></div><div><label for="email">Email</label><input id="email" name="email" type="email" required></div><div><label for="message">Message</label><textarea id="message" name="message"></textarea></div><button>Send</button></form><script type="module">import{createValidator}from'../../packages/validator-core/src/index.js';createValidator().init();</script></body></html>
